<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Karpathy Wiki">
  <defs>
    <linearGradient id="bookLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8e6cf"/>
      <stop offset="100%" stop-color="#7fd8b8"/>
    </linearGradient>
    <linearGradient id="bookRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd3b6"/>
      <stop offset="100%" stop-color="#ffaaa5"/>
    </linearGradient>
    <radialGradient id="bulbGlow">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="60%" stop-color="#ffeb3b"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="96" ry="96" fill="#ffffff"/>

  <!-- 打开的书本 -->
  <path d="M128 320 Q128 272 176 272 L248 272 L248 384 L176 384 Q128 384 128 336 Z" fill="url(#bookLeft)"/>
  <path d="M384 320 Q384 272 336 272 L264 272 L264 384 L336 384 Q384 384 384 336 Z" fill="url(#bookRight)"/>
  <!-- 书脊 -->
  <rect x="248" y="272" width="16" height="112" rx="4" fill="#81d4fa"/>
  <!-- 书页纹理 -->
  <line x1="152" y1="296" x2="232" y2="296" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="152" y1="328" x2="232" y2="328" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="280" y1="296" x2="360" y2="296" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="280" y1="328" x2="360" y2="328" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- 灯泡 -->
  <circle cx="256" cy="176" r="56" fill="url(#bulbGlow)"/>
  <!-- 灯泡底座 -->
  <rect x="236" y="224" width="40" height="24" rx="8" fill="#90a4ae"/>
  <rect x="244" y="248" width="24" height="12" rx="4" fill="#78909c"/>
  <!-- 光芒 -->
  <line x1="256" y1="88" x2="256" y2="104" stroke="#fbc02d" stroke-width="8" stroke-linecap="round"/>
  <line x1="176" y1="128" x2="188" y2="140" stroke="#fbc02d" stroke-width="8" stroke-linecap="round"/>
  <line x1="336" y1="128" x2="324" y2="140" stroke="#fbc02d" stroke-width="8" stroke-linecap="round"/>
</svg>
