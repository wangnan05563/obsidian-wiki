# e11 S7785（建议顶层 await 调用 async 函数）——仅豁免包入口 src/index.ts：
# 本项目发布产物用 esbuild --format=cjs 打成单文件 bundle，再交 SEA（node --experimental-sea-config）
# 打包成 exe（见 scripts/build-exe.ps1、deploy-linux/deploy.sh）。CJS 语法不支持顶层 await，
# 强行改成顶层 await 会让构建失败，故入口保留具名 async 函数 + void 调用（Promise 内部已 catch，
# 不产生未处理拒绝）。资源限定到单个入口文件，避免豁免面扩散。
sonar.issue.ignore.multicriteria.e11.ruleKey=typescript:S7785
sonar.issue.ignore.multicriteria.e11.resourceKey=src/index.ts