sonar.projectKey=karpathy_wiki_api
sonar.projectName=Karpathy Wiki API
sonar.sources=src
sonar.language=ts
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts,**/coverage/**
# sonar.typescript.node 原指向 D:\tools\nodejs\node.exe（该路径在本机不存在），删除后由扫描器
# 自动选用内置 Node.js 运行时（sonar-scanner 8.x 会打印 "Using embedded Node.js runtime"）。
# 覆盖率上报：npm run test:coverage 生成 coverage/lcov.info 后由扫描器读取
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.scm.disabled=true

# 忽略 let 变量声明相关规则（120+ 个问题，大多数需要 reassignment 无法改为 const）
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11

sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S7781
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts
