[package]
name = "karpathy-wiki-desktop"
version = "0.1.0"
description = "Karpathy Wiki 桌面壳 - Tauri 主进程"
edition = "2021"

[lib]
name = "karpathy_wiki_desktop_lib"
# 为什么移除 cdylib：桌面应用不需要 Android 动态库。
# cdylib 在 Windows GNU 下会生成 DLL，LLD GNU 模式默认 --export-all-symbols
# 导致符号数超过 65535 上限（Tauri 依赖链符号过多）。
# Windows 只需要 staticlib + rlib（最终链接为 exe）。
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon feature：主窗口关闭后最小化到任务栏右下角托盘
# 通过托盘菜单"显示主窗口"恢复，"退出应用"真正退出
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 为什么移除 reqwest：后端由 Node.js Sidecar 运行，Rust 主进程不需要发起 HTTP 请求
# reqwest 会引入 hyper/tonic/rustls 等大量依赖，是体积膨胀的主要来源
